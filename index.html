<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minicurso: Autoria e IA</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
            background-color: #f4f4f9; 
            color: #333;
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        h1 { font-size: 1.5em; color: #2c3e50; }
        p { font-size: 1.1em; margin-bottom: 25px; line-height: 1.5; }
        iframe { 
            width: 100%; 
            height: 450px; 
            border: none; 
            border-radius: 8px; 
            margin-bottom: 25px; 
        }
        .btn { 
            display: inline-block; 
            padding: 12px 24px; 
            background-color: #0056b3; 
            color: #ffffff; 
            text-decoration: none; 
            border-radius: 5px; 
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #004494; }
        
        /* Ajuste para telas de celular */
        @media (max-width: 600px) {
            iframe { height: 250px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Autoria e uso responsável de recursos digitais e IA</h1>
        <p>Siga o passo a passo no vídeo abaixo para aprender a utilizar materiais educacionais com atenção às fontes, licenças e transparência.</p>

        <!-- Substitua o ID "SEU_ID_AQUI" pelo código real do seu vídeo no YouTube -->
        <iframe src="https://www.youtube.com/embed/SEU_ID_AQUI" allowfullscreen></iframe>

        <!-- Substitua o "#" pelo link do Google Forms, H5P ou outra ferramenta de avaliação -->
        <a href="#" target="_blank" class="btn">Acessar Avaliação Interativa</a>
    </div>
</body>
</html>
